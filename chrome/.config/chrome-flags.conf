# Flags do google-chrome-stable. O wrapper /usr/bin/google-chrome-stable le este arquivo
# sozinho (CHROME_USER_FLAGS), entao vale pra qualquer jeito de abrir o Chrome -- atalho,
# .desktop ou menu -- e sobrevive a format por estar no repo.
#
# Forcar VA-API aqui (VaapiVideoDecodeLinuxGL + ignore-gpu-blocklist + enable-zero-copy) saiu
# em 10/09/2026: economizava CPU, mas o zero-copy dava faixa de cor errada em video no AMD e o
# ignore-gpu-blocklist ligava decode que o Chrome bloqueia de proposito nesta combinacao.
# Deixa o Chrome decidir.

# hint=auto em vez de --ozone-platform=wayland: XFCE, MATE, LXQt, Cinnamon e Budgie sobem em
# X11, e o Chrome fixado em wayland nem abre neles. Com o hint ele escolhe Wayland quando ha
# Wayland e X11 quando nao ha.
--ozone-platform-hint=auto

# O plasma-meta traz o kwallet-pam como dependencia e o pam_kwallet ja entra no /etc/pam.d/sddm,
# entao existe keyring na maquina pela primeira vez. Sem esta flag o Chrome migraria o perfil do
# backend `basic` (cookies v10, autossuficientes) pro kwallet (v11, presos ao wallet) -- e como o
# login e automatico, ninguem digita a senha que destrava o wallet: o resultado seria acordar
# deslogado de tudo depois do format. Fixar `basic` mantem a garantia de que o perfil sobrevive
# sozinho. Ver a tecnica 4 do README.
--password-store=basic

# Vulkan no ANGLE ja derrubou o compositor aqui (visto em app Electron, com duas GPUs). gl
# e o backend seguro, fixado pra um padrao novo do Chrome nao reintroduzir o crash.
--use-angle=gl

# 11/09/2026: audio do WhatsApp Web (canvas da forma de onda) travou -- nao atualizava a
# barra, nao respondia clique -- junto com `amdgpu: *ERROR* Unsupported screen format RA24`
# no journal, em rajada. E o Chrome entregando overlay direto pro Wayland (delegated
# compositing) num formato que a RX 550 recusa -- mesma familia do problema de zero-copy
# ja descartado acima. Desliga esse caminho, sem custo (Chrome volta a compor a camada ele
# mesmo em vez de sobrepor via KMS).
--disable-features=WaylandOverlayDelegation
