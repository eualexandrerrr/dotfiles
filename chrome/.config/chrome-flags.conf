# Flags do google-chrome-stable. O wrapper /usr/bin/google-chrome-stable le este arquivo
# sozinho (CHROME_USER_FLAGS), entao vale pra qualquer jeito de abrir o Chrome -- atalho,
# .desktop ou uwsm -- e sobrevive a format por estar no repo.
#
# A RX 550 (Polaris) decodifica H.264 e HEVC em hardware e NAO decodifica VP9 nem AV1
# (confirmado por vainfo). Sem VA-API ligada, todo video cai em decode por software, na CPU
# -- que aqui e o recurso mais disputado, com 12 das 16 threads fixadas na VM.

--ozone-platform=wayland

# Vulkan no ANGLE derruba o Hyprland (visto em app Electron). gl e o backend seguro, fixado
# aqui pra um padrao novo do Chrome nao reintroduzir o crash.
--use-angle=gl

--enable-features=VaapiVideoDecodeLinuxGL
--ignore-gpu-blocklist
--enable-zero-copy
