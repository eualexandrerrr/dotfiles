font=Inter:size=13
dpi-aware=no
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
layer=overlay
anchor=center
lines=12
width=48
horizontal-pad=24
vertical-pad=18
inner-pad=8
line-height=26
tabs=4
show-actions=yes

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=a6adc8ff
placeholder=6c7086ff
input=cdd6f4ff
match=cba6f7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
counter=6c7086ff
border=cba6f7ff

[border]
width=2
radius=14

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter Control+y
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
