$mod = SUPER

bind = $mod, Return, exec, uwsm app -- $terminal
bind = $mod, E, exec, uwsm app -- $explorador
bind = $mod, B, exec, uwsm app -- $navegador
bind = $mod, R, exec, uwsm app -- $menu
bind = $mod, Space, exec, uwsm app -- $menu
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, forcekillactive
bind = $mod, L, exec, uwsm app -- hyprlock
bind = $mod SHIFT, E, exec, uwsm app -- wlogout
bind = $mod, I, exec, uwsm app -- nwg-look
bind = $mod SHIFT, I, exec, uwsm app -- nwg-displays

bind = $mod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod, P, exec, hyprpicker -a

bind = , Print, exec, ~/.dotfiles/bin/captura.sh tela
bind = SHIFT, Print, exec, ~/.dotfiles/bin/recorte-clipboard.sh
bind = $mod SHIFT, S, exec, ~/.dotfiles/bin/recorte-clipboard.sh
bind = $mod SHIFT, A, exec, ~/.dotfiles/bin/captura.sh anotar
bind = $mod SHIFT, R, exec, ~/.dotfiles/bin/captura.sh gravar

bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, T, togglefloating
bind = $mod, J, togglesplit
bind = $mod, PgUp, fullscreenstate, 2
bind = $mod, PgDown, movetoworkspacesilent, special:minimizado
bind = $mod, Backspace, togglespecialworkspace, minimizado
bind = $mod, D, togglespecialworkspace, rascunho
bind = $mod SHIFT, D, movetoworkspace, special:rascunho

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod CTRL, left, movecurrentworkspacetomonitor, l
bind = $mod CTRL, right, movecurrentworkspacetomonitor, r

binde = $mod ALT, left, resizeactive, -40 0
binde = $mod ALT, right, resizeactive, 40 0
binde = $mod ALT, up, resizeactive, 0 -40
binde = $mod ALT, down, resizeactive, 0 40

bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = $mod, XF86AudioMute, exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , Caps_Lock, exec, swayosd-client --caps-lock

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mod CTRL, Escape, exec, uwsm app -- $terminal -e btop
bind = $mod SHIFT, C, exec, hyprctl reload
