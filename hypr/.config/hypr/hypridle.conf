general {
    lock_cmd = ~/.dotfiles/bin/lock.sh
    before_sleep_cmd = loginctl lock-session
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 300
    # Sintaxe Lua obrigatoria: com config em Lua o `hyprctl dispatch dpms off` responde
    # "')' expected near 'off'" e a tela nunca apagava -- falhava calado.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
