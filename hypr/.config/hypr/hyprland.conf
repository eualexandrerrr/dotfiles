source = ~/.config/hypr/monitores.conf
source = ~/.config/hypr/regras.conf
source = ~/.config/hypr/atalhos.conf

$terminal = ghostty
$explorador = thunar
$menu = fuzzel
$navegador = google-chrome-stable

exec-once = uwsm app -- awww-daemon
exec-once = ~/.dotfiles/bin/wallpaper.sh
exec-once = uwsm app -- waybar
exec-once = uwsm app -- mako
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- hyprsunset
exec-once = uwsm app -- hyprpolkitagent
exec-once = uwsm app -- swayosd-server
exec-once = uwsm app -- nm-applet --indicator
exec-once = uwsm app -- udiskie --tray
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --watch cliphist store
exec-once = ~/.dotfiles/bin/dns-rapido.sh
exec-once = ~/.dotfiles/bin/nvidia-desempenho.sh
exec-once = ~/.dotfiles/vm/reabrir-apps.sh

env = XCURSOR_THEME,Papirus-Dark
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Papirus-Dark
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
}

animations {
    enabled = true

    bezier = suave, 0.05, 0.9, 0.1, 1.0
    bezier = seco, 0.16, 1, 0.3, 1

    animation = windows, 1, 5, seco
    animation = windowsOut, 1, 4, suave, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, seco, slidefade 15%
    animation = specialWorkspace, 1, 5, seco, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

input {
    kb_layout = br
    kb_options = compose:ralt
    repeat_rate = 40
    repeat_delay = 400
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2
}

cursor {
    no_hardware_cursors = true
    default_monitor = DP-1
}

render {
    explicit_sync = 1
    explicit_sync_kms = 1
    direct_scanout = false
}

xwayland {
    force_zero_scaling = true
}
