<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início</title>
<style>
  :root {
    --base: #1e1e2e;
    --mantle: #181825;
    --surface: #313244;
    --overlay: #6c7086;
    --text: #cdd6f4;
    --subtext: #a6adc8;
    --mauve: #cba6f7;
    --blue: #89b4fa;
    --green: #a6e3a1;
    --peach: #fab387;
    --red: #f38ba8;
    --yellow: #f9e2af;
    --teal: #94e2d5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(1100px 700px at 15% -10%, #2a2440 0%, transparent 60%),
      radial-gradient(900px 600px at 95% 110%, #1f2b3a 0%, transparent 55%),
      var(--base);
    color: var(--text);
    font-family: Inter, "Noto Sans", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 24px;
  }

  main {
    width: 100%;
    max-width: 820px;
    padding: 40px 36px 32px;
    border-radius: 26px;
    background: rgba(24, 24, 37, 0.88);
    border: 1px solid rgba(108, 112, 134, 0.35);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }

  header { text-align: center; margin-bottom: 40px; }

  #relogio {
    font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(56px, 9vw, 104px);
    font-weight: 200;
    letter-spacing: -0.03em;
    line-height: 1;
    background: linear-gradient(120deg, var(--mauve), var(--blue) 55%, var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #saudacao { margin-top: 10px; font-size: 17px; color: var(--subtext); }
  #data { margin-top: 2px; font-size: 14px; color: var(--overlay); }

  form {
    display: flex;
    gap: 10px;
    margin: 0 auto 40px;
    max-width: 560px;
  }

  input {
    flex: 1;
    padding: 13px 18px;
    border-radius: 12px;
    border: 1px solid var(--surface);
    background: rgba(17, 17, 27, 0.9);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  input::placeholder { color: var(--overlay); }

  input:focus {
    border-color: var(--mauve);
    box-shadow: 0 0 0 3px rgba(203, 166, 247, 0.15);
  }

  .grade {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 12px;
  }

  a.atalho {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--surface);
    background: rgba(49, 50, 68, 0.45);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }

  a.atalho:hover {
    transform: translateY(-2px);
    border-color: var(--cor);
    background: rgba(69, 71, 90, 0.7);
  }

  .marca {
    width: 30px;
    height: 30px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: color-mix(in srgb, var(--cor) 18%, transparent);
    color: var(--cor);
    font-weight: 600;
    font-size: 13px;
  }

  footer {
    margin-top: 36px;
    text-align: center;
    font-size: 12px;
    color: var(--overlay);
  }
</style>
</head>
<body>
<main>
  <header>
    <div id="relogio">--:--</div>
    <div id="saudacao"></div>
    <div id="data"></div>
  </header>

  <form action="https://www.google.com/search" method="get">
    <input name="q" type="text" placeholder="Buscar" autofocus autocomplete="off" spellcheck="false">
  </form>

  <div class="grade">
    <a class="atalho" style="--cor: var(--red)" href="https://www.youtube.com"><span class="marca">YT</span>YouTube</a>
    <a class="atalho" style="--cor: var(--mauve)" href="https://discord.com/app"><span class="marca">DC</span>Discord</a>
    <a class="atalho" style="--cor: var(--text)" href="https://github.com/eualexandrerrr?tab=repositories"><span class="marca">GH</span>GitHub</a>
    <a class="atalho" style="--cor: var(--green)" href="https://admin.michiganroleplay.com"><span class="marca">MI</span>Michigan Admin</a>
    <a class="atalho" style="--cor: var(--peach)" href="http://191.96.81.142:40120"><span class="marca">LC</span>Live Console</a>
    <a class="atalho" style="--cor: var(--teal)" href="https://app.centralcart.com"><span class="marca">CC</span>CentralCart</a>
    <a class="atalho" style="--cor: var(--blue)" href="https://mail.google.com"><span class="marca">GM</span>Gmail</a>
    <a class="atalho" style="--cor: var(--yellow)" href="https://panel.cfx.bot"><span class="marca">CF</span>CFXBot</a>
    <a class="atalho" style="--cor: var(--green)" href="https://meuescolarapp.com.br"><span class="marca">ME</span>MeuEscolar</a>
    <a class="atalho" style="--cor: var(--blue)" href="https://servers.redm.net"><span class="marca">RM</span>RedM</a>
    <a class="atalho" style="--cor: var(--subtext)" href="https://appstoreconnect.apple.com"><span class="marca">AS</span>App Store</a>
    <a class="atalho" style="--cor: var(--mauve)" href="https://claude.ai"><span class="marca">CL</span>Claude</a>
  </div>

  <footer id="rodape"></footer>
</main>

<script>
  const relogio = document.getElementById('relogio');
  const saudacao = document.getElementById('saudacao');
  const data = document.getElementById('data');

  function tique () {
    const agora = new Date();
    relogio.textContent = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const h = agora.getHours();
    const parte = h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    saudacao.textContent = parte + ', Xande';
    data.textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  tique();
  setInterval(tique, 10000);
</script>
</body>
</html>
