monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1, transform, 1
monitor = , preferred, auto, 1

$terminal = ghostty
$fileManager = dolphin
$menu = wofi --show drun
$browser = google-chrome-stable
$dotfiles = $HOME/.dotfiles

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = udiskie --tray
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,capitaine-cursors
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(31324499)
    resize_on_border = true
    extend_border_grab_area = 12
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 3
    active_opacity = 1.0
    inactive_opacity = 0.94
    dim_inactive = true
    dim_strength = 0.08

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
        noise = 0.015
        contrast = 1.1
        brightness = 0.85
        vibrancy = 0.18
        popups = true
        popups_ignorealpha = 0.4
        special = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        offset = 0 4
        color = rgba(11111b88)
        color_inactive = rgba(11111b44)
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.5, overshot
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 88%
    animation = windowsOut, 1, 2.2, easeOutQuint, popin 88%
    animation = windowsMove, 1, 3.5, easeOutQuint
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 2.2, easeOutQuint, slidefade 15%
    animation = specialWorkspace, 1, 3, easeOutQuint, slidefadevert 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_resizing = true
}

input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    vfr = true
    vrr = 1
    new_window_takes_over_fullscreen = 2
    middle_click_paste = false
}

cursor {
    no_hardware_cursors = false
    inactive_timeout = 5
}

xwayland {
    force_zero_scaling = true
}

windowrule = float, class:.*
windowrule = suppressevent maximize, class:.*
windowrule = center, class:.*
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

windowrule = size 1280 800, class:^(com.mitchellh.ghostty)$
windowrule = size 1100 700, class:^(org.kde.dolphin)$
windowrule = size 900 600, class:^(pavucontrol)$
windowrule = size 1000 650, class:^(nm-connection-editor)$

windowrule = tile, class:^(google-chrome)$
windowrule = tile, class:^(code-oss)$
windowrule = tile, class:^(Code)$

windowrule = float, class:^(looking-glass-client)$
windowrule = size 1920 1080, class:^(looking-glass-client)$
windowrule = center, class:^(looking-glass-client)$
windowrule = noblur, class:^(looking-glass-client)$
windowrule = noshadow, class:^(looking-glass-client)$
windowrule = noborder, class:^(looking-glass-client)$
windowrule = opacity 1.0 override, class:^(looking-glass-client)$
windowrule = idleinhibit always, class:^(looking-glass-client)$
windowrule = immediate, class:^(looking-glass-client)$

windowrule = float, class:^(virt-manager)$
windowrule = size 1200 800, class:^(virt-manager)$

windowrule = opacity 0.94 0.88, class:^(com.mitchellh.ghostty)$
windowrule = opacity 0.96 0.90, class:^(org.kde.dolphin)$

layerrule = blur, waybar
layerrule = blur, wofi
layerrule = blur, notifications
layerrule = ignorealpha 0.3, waybar
layerrule = ignorealpha 0.3, wofi
layerrule = ignorealpha 0.3, notifications

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

bind = $mainMod, Q, killactive
bind = ALT, F4, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, P, pin
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = ALT, mouse:272, movewindow

bind = , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m output --clipboard-only
bind = $mainMod, Print, exec, hyprshot -m window --clipboard-only

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
