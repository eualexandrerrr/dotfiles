general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 2
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.012
    contrast = 1.0
    brightness = 0.45
    vibrancy = 0.18
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(11111b88)
}

label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d de %B"
    color = rgba(bac2deff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgba(89b4facc)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##bac2de">Senha</span>
    hide_input = false
    rounding = 12
    check_color = rgba(cba6f7ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <span foreground="##f38ba8">Senha incorreta</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(bac2deaa)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}
