[app]
allowDMA=yes

[win]
jitRender=yes
autoResize=no
quickSplash=yes
requestActivation=no

[input]
captureOnFocus=yes
autoCapture=yes
rawMouse=yes
mouseSmoothing=no
mouseRedraw=yes
grabKeyboard=no
grabKeyboardOnFocus=no
releaseKeysOnFocusLoss=yes
hideCursor=yes

[spice]
captureOnStart=yes
alwaysShowCursor=no

[egl]
vsync=no
multisample=no

[wayland]
warpSupport=yes
